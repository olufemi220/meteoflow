name: Deploy

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      image:
        type: string
        required: true

jobs:
  deploy:
    # Runner auto-hébergé dans WSL Ubuntu (Docker Desktop, intégration WSL)
    runs-on: [self-hosted, Linux]
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      NIFI_IMAGE: ${{ inputs.image }}
      COMPOSE: docker compose -p meteoflow-${{ inputs.env }} --env-file env/${{ inputs.env }}.env
      PYTHON: .venv/bin/python
      # Config Docker propre au job : évite le gestionnaire d'identifiants Windows (desktop.exe) depuis WSL
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-ci
    steps:
      - name: Préparer les secrets
        env:
          GH_NIFI_PASSWORD: ${{ secrets.NIFI_PASSWORD }}
          GH_PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          GH_MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          GH_PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
        # Secret absent de GitHub -> mot de passe aléatoire généré une fois sur le runner
        # et conservé dans /root/meteoflow-secrets/<env>.env (lisible par root seulement).
        run: |
          store=/root/meteoflow-secrets/${{ inputs.env }}.env
          mkdir -p "$(dirname "$store")" && chmod 700 "$(dirname "$store")"
          touch "$store" && chmod 600 "$store"
          for v in NIFI_PASSWORD PG_PASSWORD MONGO_PASSWORD PGADMIN_PASSWORD; do
            gh="GH_$v"; val="${!gh}"
            if [ -z "$val" ]; then
              val=$(grep "^$v=" "$store" | cut -d= -f2- || true)
              if [ -z "$val" ]; then
                val=$(openssl rand -hex 12)
                echo "$v=$val" >> "$store"
                echo "$v généré sur le runner ($store)"
              fi
            fi
            echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          nifi=$(grep '^NIFI_PASSWORD=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)
          [ ${#nifi} -ge 12 ] || { echo "::error::NIFI_PASSWORD : 12 caractères minimum"; exit 1; }
      - uses: actions/checkout@v7
      - name: Préparer Python
        run: |
          python3 -m venv .venv
          $PYTHON -m pip install -q -r requirements-dev.txt
      - name: Connexion à GHCR
        run: |
          mkdir -p "$DOCKER_CONFIG" && echo '{}' > "$DOCKER_CONFIG/config.json"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Mettre à jour la stack
        run: |
          $COMPOSE pull nifi
          $COMPOSE up -d
      - name: Déployer le flux
        run: |
          set -a; source env/${{ inputs.env }}.env; set +a
          $PYTHON scripts/deploy_flow.py --env ${{ inputs.env }}
      - name: Vérifier les données
        run: |
          set -a; source env/${{ inputs.env }}.env; set +a
          bash scripts/check_pipeline.sh ${{ inputs.env }} 600
      - name: Logs en cas d'échec
        if: failure()
        run: $COMPOSE logs --tail=100 nifi
