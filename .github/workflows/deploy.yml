name: Deploy

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      image:
        type: string
        required: true

jobs:
  deploy:
    # Runner auto-hébergé sur le PC Windows (Docker Desktop + Git Bash)
    runs-on: [self-hosted, Windows]
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        # Git Bash explicitement (le "bash" du PATH Windows est celui de WSL)
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    env:
      NIFI_IMAGE: ${{ inputs.image }}
      NIFI_PASSWORD: ${{ secrets.NIFI_PASSWORD }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
      COMPOSE: docker compose -p meteoflow-${{ inputs.env }} --env-file env/${{ inputs.env }}.env
      PYTHON: .venv/Scripts/python.exe
    steps:
      - uses: actions/checkout@v7
      - name: Préparer Python
        run: |
          python -m venv .venv
          $PYTHON -m pip install -q -r requirements-dev.txt
      - name: Connexion à GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Mettre à jour la stack
        run: |
          $COMPOSE pull nifi
          $COMPOSE up -d
      - name: Déployer le flux
        run: |
          set -a; source env/${{ inputs.env }}.env; set +a
          $PYTHON scripts/deploy_flow.py --env ${{ inputs.env }}
      - name: Vérifier les données
        run: |
          set -a; source env/${{ inputs.env }}.env; set +a
          bash scripts/check_pipeline.sh ${{ inputs.env }} 600
      - name: Logs en cas d'échec
        if: failure()
        run: $COMPOSE logs --tail=100 nifi
