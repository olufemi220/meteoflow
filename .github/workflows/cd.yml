name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: # bouton "Run workflow" pour relancer à la main

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.meta.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/meteoflow-nifi:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./nifi
          push: true
          tags: ${{ steps.meta.outputs.name }}
          build-args: NIFI_VERSION=2.12.0

  staging:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
      image: ${{ needs.image.outputs.name }}
    secrets: inherit

  prod:
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      env: prod
      image: ${{ needs.image.outputs.name }}
    secrets: inherit
